
# =========================
# Application
# =========================
spring.application.name=llm-assistance-service


# =========================
# R2DBC PostgreSQL Config
# =========================
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/llm_assistance_db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50

# =========================
# Redis Config
# =========================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms

# =========================
# Server Config
# =========================
server.port=9098

# =========================
# OpenAI Config
# =========================
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-4-turbo-preview
openai.max-tokens=1000
openai.temperature=0.7
openai.timeout=30000

# =========================
# Service URLs
# =========================
services.account=http://localhost:8081
services.transaction=http://localhost:8082
services.fraud=http://localhost:8083
services.customer=http://localhost:8084
services.payment=http://localhost:8085

# =========================
# Resilience4j Circuit Breaker
# =========================
resilience4j.circuitbreaker.instances.llmService.sliding-window-size=10
resilience4j.circuitbreaker.instances.llmService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llmService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.llmService.permitted-number-of-calls-in-half-open-state=3

# =========================
# Conversation Settings
# =========================
conversation.max-history=10
conversation.context-window=5
conversation.cache-ttl=3600
OPENAI_API_KEY=your_key_here

